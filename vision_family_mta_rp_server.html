<body class="min-h-screen flex flex-col bg-[#0b0f19] text-gray-100">

                <div>

        // Local storage helpers for Users & Roles Management
        function getUsers() {
            const users = localStorage.getItem('vision_family_users');
            return users ? JSON.parse(users) : {};
        }

        function saveUsers(users) {
            localStorage.setItem('vision_family_users', JSON.stringify(users));
        }

        function getUserRoles() {
            const roles = localStorage.getItem('vision_family_roles');
            return roles ? JSON.parse(roles) : {};
        }

        function saveUserRoles(roles) {
            localStorage.setItem('vision_family_roles', JSON.stringify(roles));
        }

        function getCurrentUser() {
            return localStorage.getItem('vision_family_current_user');
        }

        function setCurrentUser(username) {
            if (username) {
                localStorage.setItem('vision_family_current_user', username);
            } else {
                localStorage.removeItem('vision_family_current_user');
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const errorDiv = document.getElementById('auth-error');

            if (!username || !password) {
                errorDiv.textContent = "الرجاء إدخال اسم المستخدم وكلمة المرور.";
                errorDiv.classList.remove('hidden');
                return;
            }

            let users = getUsers();
            let roles = getUserRoles();

            if (users[username]) {
                if (users[username] === password) {
                    setCurrentUser(username);
                    initApp();
                } else {
                    errorDiv.textContent = "كلمة المرور غير صحيحة لهذا الحساب المسجل مسبقاً.";
                    errorDiv.classList.remove('hidden');
                }
            } else {
                // Register new user
                users[username] = password;
                saveUsers(users);

                // Assign default role 'Member' automatically for any new user except Owner if registered manually
                if (username === 'anw4aar77') {
                    roles[username] = 'Owner';
                } else if (!roles[username]) {
                    roles[username] = 'Member';
                }
                saveUserRoles(roles);

                setCurrentUser(username);
                initApp();
            }
        }

        function logoutUser() {
            setCurrentUser(null);
            location.reload();
        }

        function initApp() {
            const currentUser = getCurrentUser();
            if (!currentUser) {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('main-content-container').classList.add('hidden');
            } else {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('main-header').classList.remove('hidden');
                document.getElementById('main-content-container').classList.remove('hidden');
                document.getElementById('user-display-name').textContent = currentUser;

                // Ensure anw4aar77 always has Owner role in storage
                let roles = getUserRoles();
                if (currentUser === 'anw4aar77') {
                    roles[currentUser] = 'Owner';
                    document.getElementById('sidebar-admin-section').classList.remove('hidden');
                } else {
                    if (!roles[currentUser]) {
                        roles[currentUser] = 'Member';
                        saveUserRoles(roles);
                    }
                    document.getElementById('sidebar-admin-section').classList.add('hidden');
                }
                saveUserRoles(roles);

                // Display role badge in header
                const userRole = roles[currentUser] || 'Member';
                const badgeEl = document.getElementById('user-role-badge');
                badgeEl.textContent = userRole;
                if(userRole === 'Owner') badgeEl.className = "mr-1 text-[10px] px-2 py-0.5 rounded-full bg-red-600 text-white font-bold";
                else if(userRole === 'Dev') badgeEl.className = "mr-1 text-[10px] px-2 py-0.5 rounded-full bg-purple-600 text-white font-bold";
                else if(userRole === 'Staff') badgeEl.className = "mr-1 text-[10px] px-2 py-0.5 rounded-full bg-blue-600 text-white font-bold";
                else if(userRole === 'Whitelisted') badgeEl.className = "mr-1 text-[10px] px-2 py-0.5 rounded-full bg-emerald-600 text-white font-bold";
                else badgeEl.className = "mr-1 text-[10px] px-2 py-0.5 rounded-full bg-gray-700 text-gray-300 font-bold";

                showHome();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleRulesDropdown() {
            const submenu = document.getElementById('rules-submenu');
